name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1-5"   # nightly regression on weekdays
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make lint PY=python

  api-and-etl:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dwh
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qa -d dwh"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: pytest (API + ETL)
        run: make pytest PY=python
      - name: Robot Framework (API)
        if: always()
        run: make robot-api PY=python
      - name: Robot Framework (ETL)
        if: always()
        run: make robot-etl PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-etl-reports
          path: results/

  ui:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Robot Framework (UI, headless Chrome)
        run: make robot-ui PY=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-reports
          path: results/
