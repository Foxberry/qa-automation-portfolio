services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dwh
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d dwh"]
      interval: 2s
      timeout: 3s
      retries: 20
