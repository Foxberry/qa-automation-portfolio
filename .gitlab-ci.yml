stages: [lint, test]

default:
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq make > /dev/null
    - pip install -q -r requirements.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths: [.cache/pip]

lint:
  stage: lint
  script:
    - make lint PY=python

api-and-etl:
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: dwh
    POSTGRES_USER: qa
    POSTGRES_PASSWORD: qa
    PG_HOST: postgres
    PG_PORT: "5432"
  script:
    - make pytest PY=python
    - make robot-api PY=python
    - make robot-etl PY=python
  artifacts:
    when: always
    paths: [results/]
    reports:
      junit: results/pytest/junit.xml

ui:
  stage: test
  image: python:3.12
  before_script:
    - apt-get update -qq && apt-get install -y -qq make chromium > /dev/null
    - pip install -q -r requirements.txt
  script:
    - make robot-ui PY=python
  artifacts:
    when: always
    paths: [results/]
